<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resonantia Harmonia Concert</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="header"></header>

    <main>

        <h2>お知らせ</h2>

        <div class="news">

            <div id="news-list">
                <!-- Supabaseからお知らせを自動読み込みします -->
            </div>

            <p id="news-loading" class="news-loading">
                お知らせを読み込んでいます……
            </p>

                お知らせを読み込めませんでした。

            <button id="show-more-news" class="show-more-news" style="display: none;">

        <p>
            日時：2027年2月14日（日）　13:30開場　14:00開演<br>
            入場料：無料<br>
            会場：ルーテル学院中学高等学校 礼拝堂<br>
            指揮：林田健汰・竹原将太<br>
            司会：高田莉乃・池田朱里<br>

            運営支援：株式会社サクラハーモニー
        </p>


        <h2>参加申し込み</h2>

        <p>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLScHl9zlCWB2_wut4iedDNeGE-rcU9-S-yfXneR4IWRNYsq64Q/viewform"
                target="_blank">
                Resonantia Harmonia Concert 参加申し込みフォーム
            </a>
        </p>

    </main>

    <footer id="footer"></footer>

    <!-- Supabase -->
